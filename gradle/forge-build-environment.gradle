import groovy.json.JsonOutput
import java.security.MessageDigest

// Diagnostic evidence only. These tasks do not change Minecraft dependencies,
// compiler inputs, policies, or trial clocks.
def evidenceDirectory = providers.gradleProperty('hearthboundBuildEvidenceDir')
    .map { file(it) }.orElse(layout.buildDirectory.dir('reports/forge-build').map { it.asFile })

// An applied script does not compile against the root plugin's classpath.
// Resolve these public helpers lazily from the plugin already in this build,
// avoiding a second dependency declaration or a different plugin instance.
def forgeClass = { String name ->
    project.plugins.getPlugin('net.minecraftforge.gradle').getClass().getClassLoader().loadClass(name)
}
def installerToolsCoordinate = {
    forgeClass('net.minecraftforge.gradle.common.util.Utils').getField('INSTALLERTOOLS').get(null).toString()
}
// The same module's MCP Config tool must retain its ordinary Maven eligibility.
def nonTargetInstallerToolsCoordinate = 'net.minecraftforge:installertools:1.3.2:fatjar'
def mappedFilterPolicy = {
    def flag = forgeClass('net.minecraftforge.gradle.common.util.EnvironmentChecks').getField('FILTER_REPOS').get(null)
    Class generatedRepositoryType = forgeClass('net.minecraftforge.artifactural.gradle.GradleRepositoryAdapter')
    Map applications = project.findProperty('hearthboundMappedRepositoryFilterApplications') ?: [:]
    [policy: 'exclude-mapped-versions-once-v1', version_pattern: '.*_mapped_.*',
     upstream_repeated_filter_enabled: flag.getClass().getMethod('isEnabled').invoke(flag),
     generated_repositories_exempt: true,
     external_repositories: repositories.findAll { !generatedRepositoryType.isInstance(it) }.collect {
         [name: it.name, applications: applications.get(it) ?: 0]
     }]
}
def inspectMappedExclusions = {
    Class generatedRepositoryType = forgeClass('net.minecraftforge.artifactural.gradle.GradleRepositoryAdapter')
    Class identifier = forgeClass('net.minecraftforge.artifactural.api.artifact.ArtifactIdentifier')
    Class artifact = forgeClass('net.minecraftforge.gradle.common.util.Artifact')
    def from = artifact.getMethod('from', String)
    def mapped = from.invoke(null, 'net.minecraftforge:installertools:1.4.4_mapped_official_1.20.1:fatjar')
    def unmapped = from.invoke(null, installerToolsCoordinate())
    def nonTarget = from.invoke(null, nonTargetInstallerToolsCoordinate)
    def inspector = forgeClass('net.minecraftforge.artifactural.gradle.RepositoryContentUtils')
        .getMethod('contentFilterExcludes', org.gradle.api.artifacts.repositories.ArtifactRepository, identifier)
    // The public upstream inspector reads (and freezes) the actual filters.
    // The fallback must survive re-adding those already-used repositories.
    repositories.findAll { !generatedRepositoryType.isInstance(it) }.collect {
        [name: it.name,
         mapped_installer_excluded: inspector.invoke(null, it, mapped),
         unmapped_installer_excluded: inspector.invoke(null, it, unmapped),
         non_target_installer_excluded: inspector.invoke(null, it, nonTarget)]
    }
}

def sha256 = { File artifact ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    artifact.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        int length
        while ((length = stream.read(buffer)) != -1) digest.update(buffer, 0, length)
    }
    digest.digest().encodeHex().toString()
}

def writeEvidence = { String name, Map payload ->
    File directory = evidenceDirectory.get()
    directory.mkdirs()
    File destination = new File(directory, name)
    destination.text = JsonOutput.prettyPrint(JsonOutput.toJson(payload)) + '\n'
    logger.lifecycle("HEARTHBOUND_BUILD_EVIDENCE ${destination}")
}

tasks.register('captureHearthboundBuildEnvironment') {
    group = 'verification'
    description = 'Record actual resolved build-plugin artifacts and runtime versions.'
    doLast {
        def selected = project.buildscript.configurations.classpath.resolvedConfiguration.resolvedArtifacts
            .findAll {
                (it.moduleVersion.id.group == 'net.minecraftforge.gradle' && it.name == 'ForgeGradle') ||
                (it.moduleVersion.id.group == 'org.spongepowered' && it.name == 'mixingradle')
            }.collect {
                [group: it.moduleVersion.id.group, name: it.name,
                 resolved_version: it.moduleVersion.id.version,
                 artifact_filename: it.file.name, artifact_sha256: sha256(it.file)]
            }.sort { a, b -> "${a.group}:${a.name}" <=> "${b.group}:${b.name}" }
        writeEvidence('build-environment.json', [
            schema: 'hearthbound-forge-build-environment-v1',
            gradle_version: gradle.gradleVersion,
            java_runtime_version: System.getProperty('java.runtime.version'),
            java_vendor: System.getProperty('java.vendor'),
            configured_java_toolchain_language_version: java.toolchain.languageVersion.get().asInt(),
            resolved_build_plugins: selected,
            requested_build_plugins: [
                ForgeGradle: '6.0.54', mixingradle: '0.7-SNAPSHOT'
            ],
            installer_tools_coordinate: installerToolsCoordinate(),
            mapped_repository_filter: mappedFilterPolicy(),
            limits: [
                immutable_plugin_versions_declared: false,
                snapshot_timestamp_not_available_from_resolved_module_id: true
            ]
        ])
    }
}

tasks.register('verifyHearthboundForgeToolFallback') {
    group = 'verification'
    description = 'Exercise the actual ForgeGradle installer-tools fallback in an isolated cold build.'
    mustRunAfter tasks.named('captureHearthboundBuildEnvironment')
    doLast {
        String coordinate = installerToolsCoordinate()
        def before = repositories.toList()
        Map result = [
            schema: 'hearthbound-forge-tool-fallback-v1',
            installer_tools_coordinate: coordinate,
            non_target_installer_coordinate: nonTargetInstallerToolsCoordinate,
            mapped_repository_filter: mappedFilterPolicy(),
            repository_names_before: before.collect { it.name },
            forced_maven_exclusions: project.findProperty('hearthboundForcedInstallerMavenExclusions') ?: [],
            status: 'FAIL', errors: []
        ]
        try {
            if (result.forced_maven_exclusions.isEmpty()) {
                throw new GradleException('The diagnostic Maven exclusion init script is required.')
            }
            if (coordinate != 'net.minecraftforge:installertools:1.4.4:fatjar') {
                throw new GradleException('Installer-tools coordinate changed; review this regression gate before updating it.')
            }
            if (result.mapped_repository_filter.upstream_repeated_filter_enabled ||
                result.mapped_repository_filter.external_repositories.any { it.applications != 1 }) {
                throw new GradleException('Mapped-version filtering must be applied exactly once per external repository.')
            }
            result.mapped_exclusions_before = inspectMappedExclusions()
            def fallbackBefore = result.mapped_exclusions_before.find { it.name == 'HearthboundForgeInstallerToolsFallback' }
            if (result.mapped_exclusions_before.any { !it.mapped_installer_excluded } ||
                fallbackBefore == null || fallbackBefore.unmapped_installer_excluded) {
                throw new GradleException('Mapped versions must remain excluded while the ordinary installer tool remains eligible in the fallback.')
            }
            def forcedMavenProbes = result.mapped_exclusions_before.findAll {
                result.forced_maven_exclusions.contains(it.name)
            }
            if (forcedMavenProbes.size() != result.forced_maven_exclusions.size() ||
                forcedMavenProbes.any { !it.unmapped_installer_excluded || it.non_target_installer_excluded }) {
                throw new GradleException('Only installer-tools 1.4.4 may be excluded by the diagnostic Maven filter; MCP tool 1.3.2 must remain eligible.')
            }
            Class downloader = forgeClass('net.minecraftforge.gradle.common.util.MavenArtifactDownloader')
            File artifact = (File) downloader.getMethod('gradle', org.gradle.api.Project, String, Boolean.TYPE)
                .invoke(null, project, coordinate, false)
            result.mapped_exclusions_after = inspectMappedExclusions()
            if (artifact == null || !artifact.isFile()) {
                throw new GradleException('ForgeGradle did not resolve the installer-tools artifact.')
            }
            // A manual ForgeGradle lookup writes under forge_gradle, while its
            // Gradle fallback resolves under modules-2. Do not claim that the
            // forced path ran if a manual/in-memory cache supplied the file.
            File fallbackCache = new File(gradle.gradleUserHomeDir, 'caches/modules-2')
            if (!artifact.canonicalFile.toPath().startsWith(fallbackCache.canonicalFile.toPath())) {
                throw new GradleException('Installer-tools did not come from the Gradle fallback cache.')
            }
            List after = repositories.toList()
            boolean sameRepositoryObjects = after.size() == before.size()
            for (int index = 0; sameRepositoryObjects && index < before.size(); index++) {
                sameRepositoryObjects = after[index].is(before[index])
            }
            if (!sameRepositoryObjects) {
                throw new GradleException('ForgeGradle did not restore the original repository objects and order.')
            }
            if (result.mapped_exclusions_before != result.mapped_exclusions_after) {
                throw new GradleException('Repository content filtering changed during the actual ForgeGradle fallback.')
            }
            result.artifact_filename = artifact.name
            result.artifact_sha256 = sha256(artifact)
            result.resolution_path = 'forgegradle_non_maven_gradle_fallback'
            result.repositories_restored = true
            result.mapped_version_exclusions_verified = true
            result.non_target_maven_eligibility_verified = true
            result.status = 'PASS'
        } catch (Exception failure) {
            result.errors.add("${failure.class.name}: ${failure.message}")
            throw failure
        } finally {
            result.repository_names_after = repositories.collect { it.name }
            writeEvidence('fallback-verification.json', result)
        }
    }
}
