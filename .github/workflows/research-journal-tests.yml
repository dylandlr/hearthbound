name: Research journal Java 17 checks
on:
  push:
    branches:
      - 'test/research-journal-verification-v0-7-13'
      - 'feat/world-bound-research-journals-v0-7-12'
  pull_request:
    paths:
      - 'src/main/java/dev/hearthbound/evidence/**'
      - 'src/test/java/dev/hearthbound/evidence/**'
      - 'scripts/test-research-journals.sh'
      - '.github/workflows/research-journal-tests.yml'
jobs:
  pure-java-journal-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run standalone research tests
        run: bash scripts/test-research-journals.sh
