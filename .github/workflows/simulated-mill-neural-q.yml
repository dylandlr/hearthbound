name: Simulated partial-observation neural Q checks
on:
  pull_request:
    paths:
      - 'scripts/train_simulated_mill_neural_q.py'
      - 'scripts/test_train_simulated_mill_neural_q.py'
      - '.github/workflows/simulated-mill-neural-q.yml'
  workflow_dispatch:
jobs:
  simulated-neural-q:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate neural trainer and simulator without Minecraft claims
        run: |
          python -m py_compile scripts/train_simulated_mill_neural_q.py scripts/test_train_simulated_mill_neural_q.py
          python scripts/test_train_simulated_mill_neural_q.py
      - name: Produce bounded held-out neural Q baseline
        run: |
          python scripts/train_simulated_mill_neural_q.py \
            --seed 11 --episodes 300 --heldout 80 \
            --output simulated-mill-neural-q-results.json \
            --checkpoint simulated-mill-neural-q-checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: simulated-mill-neural-q-results
          path: |
            simulated-mill-neural-q-results.json
            simulated-mill-neural-q-checkpoint.json
          if-no-files-found: error
