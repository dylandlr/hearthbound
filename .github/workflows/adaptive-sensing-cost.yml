name: Adaptive observation cost without hard budgets
on:
  pull_request:
    paths:
      - 'scripts/train_adaptive_sensing_cost.py'
      - 'scripts/test_train_adaptive_sensing_cost.py'
      - '.github/workflows/adaptive-sensing-cost.yml'
  workflow_dispatch:
jobs:
  sensing-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify reproducibility, soft costs, and task-source preflight
        run: |
          python3 -m py_compile scripts/train_adaptive_sensing_cost.py scripts/test_train_adaptive_sensing_cost.py
          python3 scripts/test_train_adaptive_sensing_cost.py
      - name: Train and compare three cost policies with frozen age-aware controller
        run: |
          python3 scripts/train_adaptive_sensing_cost.py \
            --low-episodes 350 --train-episodes 480 \
            --legacy-episodes 520 --heldout 16 \
            --output adaptive-sensing-cost.json
      - name: Verify scientific scope and complete matrix
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open("adaptive-sensing-cost.json"))
          assert r["schema"]=="hearthbound.adaptive-sensing-cost.v1"
          assert r["training_origin"]==r["evaluation_origin"]=="SIMULATED_ONLY"
          assert r["minecraft_worlds"]==0 and r["minecraft_task_authorized"] is False
          assert r["hard_refresh_budget"] is False
          assert len(r["results"])==3
          for row in r["results"]:
              assert len(row["results"])==4
              for scenes in row["results"].values():
                  assert len(scenes)==5
                  for case in scenes.values():
                      for policy in ("free","low","medium","legacy"):
                          assert case[policy]["episodes"]==16
                          assert case[policy]["executed_invalid_requests"]==0
          print("PASS 3 training seeds x 4 novel faults x 5 resource regimes x 16 episodes per policy")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-observation-cost-evidence
          path: adaptive-sensing-cost.json
          if-no-files-found: error
