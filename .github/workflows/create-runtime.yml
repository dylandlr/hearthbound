name: Create 6.0.8 Runtime Compatibility
on:
  workflow_dispatch:
  push:
    branches: [feature/first-mill-foundation]
    paths:
      - 'src/main/java/dev/hearthbound/create/**'
      - 'scripts/install-create-ci.py'
      - 'scripts/forge-create-probe.py'
      - '.github/workflows/create-runtime.yml'
permissions:
  contents: read
jobs:
  create-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Fetch compatible Create 6.0.8 runtime and dependencies
        run: python3 scripts/install-create-ci.py
      - name: Configure disposable world
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nlevel-name=hearthbound-create-ci\nmax-players=1\nenable-rcon=true\nrcon.password=hearthbound-ci-only-password\nrcon.port=25575\n' > run/server.properties
      - name: Start Forge with Create loaded
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=15s 220s gradle --no-daemon runServer > forge-create.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 170); do
            if grep -E -q 'Done \([0-9.]+s\)! For help, type "help"' forge-create.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              tail -150 forge-create.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            tail -150 forge-create.log
            exit 1
          fi
          python3 scripts/forge-create-probe.py
          kill -INT "$pid" 2>/dev/null || true
          wait "$pid" || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-compatibility-logs
          path: |
            forge-create.log
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
