name: Create 6.0.8 Runtime Compatibility
on:
  workflow_dispatch:
  push:
    branches: [feature/first-mill-foundation]
    paths:
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - 'scripts/install-create-ci.py'
      - 'scripts/forge-create-probe.py'
      - 'scripts/worker-selection-probe.py'
      - 'scripts/workshop-shared-probe.py'
      - '.github/workflows/create-runtime.yml'
permissions:
  contents: read
jobs:
  create-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build reobfuscated Hearthbound distribution JAR
        run: gradle --no-daemon build
      - name: Install production Forge dedicated server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          curl -fL --retry 3 -o forge-installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar
          java -jar forge-installer.jar --installServer run
      - name: Fetch compatible Create 6.0.8 runtime and dependencies
        run: python3 scripts/install-create-ci.py
      - name: Install Hearthbound into production server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/mods
          find build/libs -maxdepth 1 -name '*.jar' -print
          cp build/libs/hearthbound-*.jar run/mods/
          ls -lh run/mods/*.jar
      - name: Configure disposable world
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nlevel-name=hearthbound-create-ci\nmax-players=1\nenable-rcon=true\nrcon.password=hearthbound-ci-only-password\nrcon.port=25575\n' > run/server.properties
      - name: Start Forge with Create loaded
        shell: bash
        run: |
          set -euo pipefail
          (cd run && timeout --signal=INT --kill-after=15s 300s bash ./run.sh nogui) > forge-create.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 170); do
            if grep -E -q 'Done \([0-9.]+s\)! For help, type "help"' forge-create.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              tail -150 forge-create.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            tail -150 forge-create.log
            exit 1
          fi
          python3 scripts/forge-create-probe.py
          python3 scripts/workshop-shared-probe.py stage
          wait "$pid"
          (cd run && timeout --signal=INT --kill-after=15s 180s bash ./run.sh nogui) > forge-shared-restart.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 100); do
            if grep -E -q 'Done \([0-9.]+s\)! For help, type "help"' forge-shared-restart.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              tail -150 forge-shared-restart.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            tail -150 forge-shared-restart.log
            exit 1
          fi
          python3 scripts/workshop-shared-probe.py after-restart
          wait "$pid"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-compatibility-logs
          path: |
            forge-create.log
            forge-shared-restart.log
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
