name: Graphical Minecraft Cargo Check
on:
  workflow_dispatch:
  push:
    branches: [feature/first-mill-foundation]
    paths:
      - 'src/main/java/**'
      - 'src/main/resources/assets/hearthbound/**'
      - 'scripts/prepare-minecraft-client.py'
      - 'scripts/graphical-client-probe.py'
      - 'scripts/workshop-controls-client.py'
      - '.github/workflows/graphical-client.yml'
permissions:
  contents: read
jobs:
  graphical-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build distribution and run unit tests
        run: gradle --no-daemon build
      - name: Install graphical test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth xdotool ffmpeg libgl1-mesa-dri libopenal1
      - name: Install production Forge server and client
        run: |
          mkdir -p run client-run
          printf '{"profiles":{}}' > client-run/launcher_profiles.json
          curl -fL --retry 3 -o forge-installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar
          java -jar forge-installer.jar --installServer run
          java -jar forge-installer.jar --installClient client-run
      - name: Fetch pinned Create and prepare client assets
        run: |
          python3 scripts/install-create-ci.py
          python3 scripts/prepare-minecraft-client.py
          cp build/libs/hearthbound-*.jar run/mods/
          mkdir -p client-run/mods
          cp run/mods/*.jar client-run/mods/
      - name: Run real graphical client against dedicated server
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 -u scripts/graphical-client-probe.py
      - name: Upload client capture and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphical-client-evidence
          path: |
            client-evidence/
            client-run/logs/
            client-run/crash-reports/
            run/logs/
            run/crash-reports/
          if-no-files-found: warn
          retention-days: 14
