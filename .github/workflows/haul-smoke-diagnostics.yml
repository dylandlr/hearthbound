name: Read-only Forge hauling diagnostics contract
on:
  pull_request:
    paths:
      - 'scripts/rcon_smoke.py'
      - 'scripts/haul_smoke_diagnostics.py'
      - 'scripts/test_haul_smoke_diagnostics.py'
      - '.github/workflows/haul-smoke-diagnostics.yml'
  workflow_dispatch:
jobs:
  validate-haul-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify timeout, read-only command boundaries and distinct request IDs
        run: python3 scripts/test_haul_smoke_diagnostics.py
