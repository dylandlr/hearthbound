name: Read-only Forge hauling diagnostics contract
on:
  pull_request:
    paths:
      - 'scripts/rcon_smoke.py'
      - 'scripts/haul_smoke_diagnostics.py'
      - 'scripts/test_haul_smoke_diagnostics.py'
      - 'scripts/test_haul_smoke_simulated_rcon.py'
      - 'scripts/haul_arrival_evidence.py'
      - 'scripts/test_haul_arrival_evidence.py'
      - 'src/main/java/dev/hearthbound/world/HaulArrivalWitness.java'
      - 'src/main/java/dev/hearthbound/evidence/HaulArrivalGeometry.java'
      - 'src/test/java/dev/hearthbound/evidence/HaulArrivalGeometryTest.java'
      - '.github/workflows/haul-smoke-diagnostics.yml'
  workflow_dispatch:
jobs:
  validate-haul-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify timeout, read-only command boundaries and distinct request IDs
        run: |
          set -euo pipefail
          python3 scripts/test_haul_smoke_diagnostics.py
          python3 scripts/test_haul_smoke_simulated_rcon.py
          python3 -m unittest discover -s scripts -p test_haul_arrival_evidence.py -v
