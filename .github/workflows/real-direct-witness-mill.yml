name: Real Forge two-citizen source-witness milling
on:
  push:
    branches:
      - 'feat/direct-witness-hauling-v0-16-0'
  pull_request:
    paths:
      - 'src/main/java/dev/hearthbound/world/DirectSourceWitnessBridge.java'
      - 'src/main/java/dev/hearthbound/evidence/DirectSourceWitnessContract.java'
      - 'src/main/java/dev/hearthbound/world/SableController.java'
      - 'scripts/rcon_sable_first_mill.py'
      - '.github/workflows/real-direct-witness-mill.yml'
jobs:
  direct-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Real Forge source witness must precede actual executor Create experiment
        shell: bash
        env:
          HEARTHBOUND_RCON_PASSWORD: ci-local-disposable-password
          HEARTHBOUND_DIRECT_WITNESS: '1'
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/rcon_sable_first_mill.py
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nlevel-name=direct-witness-create-world\nmax-players=2\nenable-rcon=true\nrcon.port=25575\nrcon.password=%s\n' "$HEARTHBOUND_RCON_PASSWORD" > run/server.properties
          gradle --no-daemon runServer > real-direct-witness-forge.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 360); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' real-direct-witness-forge.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              tail -n 120 real-direct-witness-forge.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then tail -n 120 real-direct-witness-forge.log; exit 1; fi
          python3 scripts/rcon_sable_first_mill.py | tee real-direct-witness-rcon.log
          grep -q 'REAL_FORGE_TWO_ROLE_WITNESS_PASS' real-direct-witness-rcon.log
          grep -q 'MILL_WITNESS_EVIDENCE status=VERIFIED' real-direct-witness-rcon.log
          grep -q 'status=DENIED reason=WITNESS_EVIDENCE_CHANGED_OR_WRONG_JOB' real-direct-witness-rcon.log
          grep -q 'HEARTHBOUND_PROCESS_RECEIPT' real-direct-witness-forge.log
          echo "REAL_FORGE_DIRECT_WITNESS_CREATE_PASS reward_authorized=false learning_authorized=false"
      - name: Save real server evidence, including rejection cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-direct-source-witness-forge-evidence
          path: |
            real-direct-witness-forge.log
            real-direct-witness-rcon.log
            run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
