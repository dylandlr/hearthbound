name: GRU matched optimizer sequence research
on:
  pull_request:
    paths:
      - 'scripts/benchmark_gru_matched_optimizer.py'
      - 'scripts/test_benchmark_gru_matched_optimizer.py'
      - '.github/workflows/gru-matched-optimizer.yml'
  workflow_dispatch:
jobs:
  evaluate-matched-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric dependency
        run: python3 -m pip install 'numpy>=1.26,<3'
      - name: Test matched updates and temporal derivatives
        run: |
          set -euo pipefail
          python3 scripts/test_benchmark_gru_matched_optimizer.py
      - name: Evaluate matched training across three seeds and fixed trajectories
        run: |
          set -euo pipefail
          python3 scripts/benchmark_gru_matched_optimizer.py \
            --seeds 11 17 23 --episodes 180 --heldout 30 \
            --output gru-matched-optimizer.json
          python3 -c 'import json; x=json.load(open("gru-matched-optimizer.json")); assert x["origin"]=="SIMULATED_ONLY" and x["same_update_cadence"] and x["same_initial_weights"] and x["heldout_latent_timelines_shared"] and not x["minecraft_model_promotion_authorized"] and len(x["cases"])==36'
      - uses: actions/upload-artifact@v4
        with:
          name: gru-matched-optimizer-three-seed-comparison
          path: gru-matched-optimizer.json
          if-no-files-found: error
