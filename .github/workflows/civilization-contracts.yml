name: Civilization decision contracts
on:
  pull_request:
    paths:
      - 'src/main/java/dev/hearthbound/civilization/**'
      - 'src/test/java/dev/hearthbound/civilization/**'
      - 'scripts/test-civilization-contracts.py'
      - '.github/workflows/civilization-contracts.yml'
  push:
    paths:
      - 'src/main/java/dev/hearthbound/civilization/**'
      - 'src/test/java/dev/hearthbound/civilization/**'
      - 'scripts/test-civilization-contracts.py'
      - '.github/workflows/civilization-contracts.yml'
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 scripts/test-civilization-contracts.py
