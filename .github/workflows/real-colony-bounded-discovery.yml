name: Real Forge bounded idle colony discovery
on:
  pull_request:
    paths:
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/forge-build-environment.gradle'
      - 'src/main/java/dev/hearthbound/civilization/**'
      - 'src/test/java/dev/hearthbound/civilization/**'
      - 'src/main/java/dev/hearthbound/world/CivilizationRuntime.java'
      - 'src/main/java/dev/hearthbound/world/SableController.java'
      - 'src/main/java/dev/hearthbound/world/SableHauling.java'
      - 'src/main/java/dev/hearthbound/world/SourceWheatObservation.java'
      - 'src/main/java/dev/hearthbound/world/CitizenSourceKnowledge.java'
      - 'scripts/rcon_colony_bounded_discovery.py'
      - 'scripts/test_colony_bounded_discovery.py'
      - 'scripts/rcon_colony_completion_boundary.py'
      - 'scripts/rcon_neural_report_haul.py'
      - 'scripts/run_colony_reliability_trial.py'
      - '.github/workflows/real-colony-bounded-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HEARTHBOUND_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.8'}
      - name: Test discovery contracts and compile Forge
        run: |
          test "$(git rev-parse HEAD)" = "$HEARTHBOUND_EXPECTED_COMMIT"
          python3 -m py_compile scripts/rcon_colony_bounded_discovery.py
          python3 -m unittest discover -s scripts -p test_colony_bounded_discovery.py -v
          python3 scripts/test-civilization-contracts.py
          gradle --no-daemon compileJava compileTestJava > colony-bounded-discovery-compile.log 2>&1 || (tail -n 120 colony-bounded-discovery-compile.log; exit 1)
      - name: Discover an outer source and verify physical work through restart
        shell: bash
        env:
          HEARTHBOUND_RCON_PASSWORD: ci-disposable-bounded-discovery
        run: |
          set -euo pipefail
          mkdir -p run
          test ! -e run/colony-bounded-discovery-world
          test ! -e run/server.properties
          printf 'eula=true\n' > run/eula.txt
          printf 'server-ip=127.0.0.1\nonline-mode=false\nlevel-name=colony-bounded-discovery-world\nlevel-seed=bounded-discovery-v1\nmax-players=2\nenable-rcon=true\nrcon.port=25575\nrcon.password=%s\n' "$HEARTHBOUND_RCON_PASSWORD" > run/server.properties
          pid=''
          trap 'if [ -n "$pid" ]; then kill -- "-$pid" 2>/dev/null || true; fi' EXIT
          boot() {
            local log="$1"
            setsid gradle --no-daemon runServer > "$log" 2>&1 &
            pid=$!
            for i in $(seq 1 360); do
              if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' "$log"; then
                grep -Fq 'Hearthbound bootstrap loaded.' "$log"
                return
              fi
              if ! kill -0 "$pid" 2>/dev/null; then tail -n 120 "$log"; return 1; fi
              sleep 2
            done
            tail -n 120 "$log"
            return 1
          }
          await_stop() {
            for i in $(seq 1 90); do
              if ! kill -0 "$pid" 2>/dev/null; then wait "$pid"; pid=''; return; fi
              sleep 1
            done
            echo 'Server did not stop cleanly' >&2
            return 1
          }
          boot colony-bounded-discovery-first-server.log
          python3 scripts/rcon_colony_bounded_discovery.py before | tee colony-bounded-discovery-before-rcon.log
          grep -Fq 'COLONY_BOUNDED_DISCOVERY_PASS ' colony-bounded-discovery-before-rcon.log
          await_stop
          boot colony-bounded-discovery-second-server.log
          python3 scripts/rcon_colony_bounded_discovery.py after | tee colony-bounded-discovery-after-rcon.log
          grep -Fq 'COLONY_BOUNDED_DISCOVERY_RESTART_PASS ' colony-bounded-discovery-after-rcon.log
          await_stop
          sha256sum colony-bounded-discovery-*.json colony-bounded-discovery-*.log > colony-bounded-discovery-evidence.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colony-bounded-discovery-evidence
          path: |
            colony-bounded-discovery-*.json
            colony-bounded-discovery-*.log
            colony-bounded-discovery-evidence.sha256
            run/colony-bounded-discovery-world/data/hearthbound_colony_tasks_v1.dat
            run/colony-bounded-discovery-world/data/hearthbound_world_identity_v1.dat
            run/colony-bounded-discovery-world/entities/
            run/logs/latest.log
          if-no-files-found: warn
