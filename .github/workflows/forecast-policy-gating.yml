name: Frozen forecaster attention policy study
on:
  pull_request:
    paths:
      - 'scripts/benchmark_forecast_policy_gating.py'
      - 'scripts/test_benchmark_forecast_policy_gating.py'
      - '.github/workflows/forecast-policy-gating.yml'
  workflow_dispatch:
jobs:
  frozen-model-policy-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python3 -m pip install 'numpy>=1.26,<3'
      - name: Verify causal policy and frozen model contracts
        run: |
          set -euo pipefail
          python3 scripts/test_benchmark_forecast_policy_gating.py
      - name: Evaluate inspection rules against common frozen source timelines
        run: |
          set -euo pipefail
          python3 scripts/benchmark_forecast_policy_gating.py \
            --seeds 11 17 23 --episodes 180 --heldout 24 \
            --output forecast-policy-gating.json
          python3 -c 'import json; d=json.load(open("forecast-policy-gating.json")); assert d["origin"]=="SIMULATED_ONLY" and len(d["cases"])==36 and d["same_frozen_forecaster_for_every_policy_per_seed"] and d["frozen_trajectories_shared_between_policies"] and d["minecraft_model_promotion_authorized"] is False'
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-forecast-decision-policy-comparison
          path: forecast-policy-gating.json
          if-no-files-found: error
