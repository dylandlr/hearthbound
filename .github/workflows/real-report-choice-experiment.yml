name: Real Forge paired information-dependency experiment
on:
  push:
    branches:
      - 'feat/report-conditioned-choice-experiment-v0-16-1'
  pull_request:
    paths:
      - 'src/main/java/dev/hearthbound/evidence/ReportConditionedChoice.java'
      - 'src/main/java/dev/hearthbound/world/ReportChoiceCommands.java'
      - 'src/main/java/dev/hearthbound/world/CitizenKnowledgeExchange.java'
      - 'scripts/rcon_report_choice_experiment.py'
      - '.github/workflows/real-report-choice-experiment.yml'
jobs:
  paired-report-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Same live world, same source menu; manipulate only report exposure
        shell: bash
        env:
          HEARTHBOUND_RCON_PASSWORD: ci-local-disposable-password
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/rcon_report_choice_experiment.py
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nlevel-name=report-choice-world\nmax-players=2\nenable-rcon=true\nrcon.port=25575\nrcon.password=%s\n' "$HEARTHBOUND_RCON_PASSWORD" > run/server.properties
          gradle --no-daemon runServer > real-report-choice-forge.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 360); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' real-report-choice-forge.log; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then tail -n 100 real-report-choice-forge.log; exit 1; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then tail -n 100 real-report-choice-forge.log; exit 1; fi
          python3 scripts/rcon_report_choice_experiment.py | tee real-report-choice-rcon.log
          grep -q 'REAL_FORGE_REPORT_EXPOSURE_PAIRED_PASS' real-report-choice-rcon.log
          grep -q 'REAL_FORGE_REPORT_UPDATE_SWITCH_PASS' real-report-choice-rcon.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("real-report-choice-results.json").read_text())
          assert j["same_world"] and j["same_candidate_menu"]
          assert j["world_inventory_held_constant_during_paired_test"]
          assert j["withheld_after_report"] == "ABSTAIN"
          assert j["exposed_after_report"] == "CHOOSE_SOURCE_A"
          assert j["after_unannounced_source_mutation"] == "CHOOSE_SOURCE_A_STALE"
          assert j["after_new_empty_report"] == "CHOOSE_SOURCE_B"
          assert j["physical_haul_executed"] is False
          assert j["reward_authorized"] is False
          assert j["neural_learning_performed"] is False
          assert j["research_credit"] == 0
          print("REAL_FORGE_INFO_DECISION_ACCEPTED no_omniscience=true no_training=true")
          PY
      - name: Archive physical-world and policy-input evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-report-conditioned-decision-evidence
          path: |
            real-report-choice-forge.log
            real-report-choice-rcon.log
            real-report-choice-results.json
            run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
