name: Real Forge four-citizen autonomous colony acceptance
on:
  pull_request:
    paths:
      - 'src/main/java/dev/hearthbound/civilization/**'
      - 'src/main/java/dev/hearthbound/world/CivilizationRuntime.java'
      - 'src/main/java/dev/hearthbound/world/SourceReportSession.java'
      - 'src/test/java/dev/hearthbound/civilization/**'
      - 'src/main/java/dev/hearthbound/world/SableController.java'
      - 'scripts/rcon_civilization_four_citizens.py'
      - 'scripts/summarize_colony_trials.py'
      - 'scripts/test_social_communication_evidence.py'
      - 'scripts/test_summarize_colony_trials.py'
      - 'scripts/export-four-citizen-benchmark.js'
      - 'scripts/export-four-citizen-benchmark.test.js'
      - 'scripts/score-verified-citizen-participation.js'
      - 'scripts/score-verified-citizen-participation.test.js'
      - '.github/workflows/real-four-citizen-colony.yml'
  workflow_dispatch:
jobs:
  four-citizen-colony:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - trial: 0
            seed: hearthbound-four-citizen-v0-3
          - trial: 1
            seed: hearthbound-four-citizen-v0-8-1
          - trial: 2
            seed: hearthbound-four-citizen-v0-8-2
    env:
      HEARTHBOUND_WORLD_SEED: ${{ matrix.seed }}
      HEARTHBOUND_TRIAL: ${{ matrix.trial }}
    steps:
      - uses: actions/checkout@v4
      - name: Register planned fresh-world trial before compilation
        run: |
          test ! -e run/four-citizen-colony
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('trial-metadata.json').write_text(json.dumps({
              'trial': int(os.environ['HEARTHBOUND_TRIAL']),
              'seed': os.environ['HEARTHBOUND_WORLD_SEED'],
              'commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'fresh_world': True}))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Static check of RCON acceptance and collaboration export
        run: |
          python3 -m py_compile scripts/rcon_civilization_four_citizens.py
          node --check scripts/export-four-citizen-benchmark.js
          node scripts/export-four-citizen-benchmark.test.js
          node --check scripts/score-verified-citizen-participation.js
          node scripts/score-verified-citizen-participation.test.js
      - name: Verify scoped Java decision contracts
        run: python3 scripts/test-civilization-contracts.py
      - name: Compile Forge and test sources
        run: gradle --no-daemon compileJava compileTestJava > colony-preflight.log 2>&1 || (tail -n 120 colony-preflight.log; exit 1)
      - name: Boot disposable Forge world and demand four physical deliveries
        shell: bash
        env:
          HEARTHBOUND_RCON_PASSWORD: ci-four-citizen-colony
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nlevel-name=four-citizen-colony\nlevel-seed=%s\nmax-players=2\nenable-rcon=true\nrcon.port=25575\nrcon.password=%s\n' "$HEARTHBOUND_WORLD_SEED" "$HEARTHBOUND_RCON_PASSWORD" > run/server.properties
          gradle --no-daemon runServer > real-four-citizen-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 360); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' real-four-citizen-server.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              tail -n 120 real-four-citizen-server.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 120 real-four-citizen-server.log
            echo "CIVILIZATION_FORGE_SERVER_NOT_READY"
            exit 1
          fi
          grep -Fq 'Hearthbound bootstrap loaded.' real-four-citizen-server.log
          python3 scripts/rcon_civilization_four_citizens.py | tee real-four-citizen-rcon.log
          grep -Fq 'CIVILIZATION_FOUR_CITIZEN_ACCEPTANCE_PASS' real-four-citizen-rcon.log
          node scripts/export-four-citizen-benchmark.js real-four-citizen-rcon.log four-citizen-benchmark-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-four-citizen-colony-evidence-${{ matrix.trial }}
          path: |
            trial-metadata.json
            run/server.properties
            colony-preflight.log
            real-four-citizen-rcon.log
            four-citizen-benchmark-evidence.json
            real-four-citizen-server.log
            run/logs/latest.log
          if-no-files-found: warn

  summarize-world-trials:
    if: always()
    needs: four-citizen-colony
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: real-four-citizen-colony-evidence-*
          path: trial-evidence
      - name: Retain all planned worlds and report uncertainty
        if: always()
        run: python3 scripts/summarize_colony_trials.py trial-evidence colony-reliability.json
      - uses: actions/upload-artifact@v4
        with:
          name: colony-reliability-summary-${{ github.run_attempt }}
          path: colony-reliability.json
