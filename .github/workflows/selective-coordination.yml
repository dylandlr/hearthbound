name: Selective recurrent coordination (simulator only)
on:
  pull_request:
    paths:
      - 'scripts/selective_communication_env.py'
      - 'scripts/recurrent_coordination_policy.py'
      - 'scripts/run_selective_coordination.py'
      - 'scripts/test*selective*.py'
      - 'scripts/test_recurrent_coordination_policy.py'
      - 'docs/SELECTIVE_RECURRENT_COORDINATION_V0_19.md'
      - '.github/workflows/selective-coordination.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-and-frozen-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - name: Verify selective transport and paired recipient evaluation
        run: python -m unittest discover -s scripts -p 'test*selective*.py' -v
      - name: Verify recurrent gradients, PPO, and continuous reward ledgers
        run: python -m unittest discover -s scripts -p 'test_recurrent_coordination_policy.py' -v
      - name: Retain frozen-physics regression contracts
        run: python -m unittest discover -s scripts -p 'test*distributed*.py' -v
      - name: Train every variant and evaluate every declared condition
        run: >-
          python scripts/run_selective_coordination.py
          --episodes 8 --training-seeds 101 --worlds 2
          --evaluation-seed-start 73041 --agents 4 --horizon 64 --workers 2
          --output-dir run/selective-coordination-ci
      - name: Verify planned denominators and paired physical integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('run/selective-coordination-ci/report.json').read_text())
          assert report['evaluation_weights_frozen'] is True
          assert report['forge_control_enabled'] is False
          assert report['minecraft_worlds'] == 0
          assert report['learned_occupation_established'] is False
          assert len(report['training']) == 3
          assert all(r['status'] == 'valid' and r['actor_parameter_changed']
                     and r['critic_parameter_changed'] for r in report['training'])
          rows, forks = report['runs'], report['recipient_forks']
          assert len(rows) == report['protocol']['planned_evaluation_slots'] == 76
          assert len({r['run_id'] for r in rows}) == 76
          assert all(r['status'] == 'valid' for r in rows)
          assert all(r['conservation_residual_A'] == r['conservation_residual_B']
                     == r['demand_residual'] == 0 for r in rows)
          assert len(forks) == report['protocol']['planned_recipient_forks'] == 8
          assert len({r['fork_id'] for r in forks}) == 8
          assert all(r['status'] in ('valid', 'no_opportunity') for r in forks)
          for r in forks:
              if r['status'] == 'valid':
                  assert r['identical_index_physics_and_cost'] is True
                  assert r['readable_continuation_reproduces_baseline'] is True
          print('Synthetic learning and recipient intervention contracts passed.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selective-coordination-simulator-evidence
          path: run/selective-coordination-ci/
          if-no-files-found: warn
