name: Policy kernel regression
on:
  push:
    paths:
      - 'src/main/java/dev/hearthbound/ai/**'
      - 'src/test/java/dev/hearthbound/ai/**'
      - '.github/workflows/policy-kernel.yml'
  pull_request:
    paths:
      - 'src/main/java/dev/hearthbound/ai/**'
      - 'src/test/java/dev/hearthbound/ai/**'
      - '.github/workflows/policy-kernel.yml'
jobs:
  pure-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile policy without Minecraft dependencies
        run: |
          mkdir -p build/policy-test
          javac -d build/policy-test src/main/java/dev/hearthbound/research/CitizenTaskArbiter.java src/main/java/dev/hearthbound/ai/*.java src/test/java/dev/hearthbound/ai/*.java
      - name: Run regression checks
        run: |
          java -cp build/policy-test dev.hearthbound.ai.PolicyKernelTest
          java -cp build/policy-test dev.hearthbound.ai.StochasticPriorityPolicyTest
          java -cp build/policy-test dev.hearthbound.ai.CitizenWorkDispatcherTest
