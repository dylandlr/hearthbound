name: Trained mill MLP Java parity
on:
  pull_request:
    paths:
      - 'src/main/java/dev/hearthbound/evidence/MillMlpInference.java'
      - 'src/main/java/dev/hearthbound/evidence/MillPolicyShadow.java'
      - 'src/main/java/dev/hearthbound/evidence/MillObservationV2.java'
      - 'src/test/java/dev/hearthbound/evidence/MillObservationV2Test.java'
      - 'src/main/java/dev/hearthbound/evidence/SourceAwareMillPlanner.java'
      - 'src/test/java/dev/hearthbound/evidence/SourceAwareMillPlannerTest.java'
      - 'src/test/java/dev/hearthbound/evidence/MillPolicyShadowTest.java'
      - 'src/test/java/dev/hearthbound/evidence/MillMlpInferenceTest.java'
      - 'src/main/resources/hearthbound/policy/**'
      - '.github/workflows/trained-mill-mlp.yml'
  workflow_dispatch:
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run bundled model parity checks
        run: |
          mkdir -p /tmp/hb-mlp
          javac --release 17 -d /tmp/hb-mlp \
            src/main/java/dev/hearthbound/evidence/MillMlpInference.java \
            src/main/java/dev/hearthbound/evidence/MillPolicyShadow.java \
            src/main/java/dev/hearthbound/evidence/MillObservationV2.java \
            src/main/java/dev/hearthbound/evidence/SourceAwareMillPlanner.java \
            src/test/java/dev/hearthbound/evidence/MillMlpInferenceTest.java \
            src/test/java/dev/hearthbound/evidence/MillPolicyShadowTest.java \
            src/test/java/dev/hearthbound/evidence/SourceAwareMillPlannerTest.java \
            src/test/java/dev/hearthbound/evidence/MillObservationV2Test.java
          java -cp /tmp/hb-mlp:src/main/resources \
            dev.hearthbound.evidence.MillMlpInferenceTest
          java -cp /tmp/hb-mlp:src/main/resources \
            dev.hearthbound.evidence.MillPolicyShadowTest
          java -cp /tmp/hb-mlp:src/main/resources \
            dev.hearthbound.evidence.SourceAwareMillPlannerTest
          java -cp /tmp/hb-mlp:src/main/resources \
            dev.hearthbound.evidence.MillObservationV2Test
