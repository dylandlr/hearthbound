name: Sable-powered First Mill gameplay
on:
  push:
    branches:
      - feat/first-mill-create-v3-2
  workflow_dispatch:
jobs:
  sable-mill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Verify physical citizen hauling and Create processing
        shell: bash
        env:
          HEARTHBOUND_RCON_PASSWORD: ci-local-disposable-password
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/rcon_sable_first_mill.py
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nlevel-name=sable-first-mill-world\nmax-players=2\nenable-rcon=true\nrcon.port=25575\nrcon.password=%s\n' "$HEARTHBOUND_RCON_PASSWORD" > run/server.properties
          gradle --no-daemon runServer > sable-first-mill.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 240); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' sable-first-mill.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              tail -n 120 sable-first-mill.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 120 sable-first-mill.log
            exit 1
          fi
          set +e
          python3 scripts/rcon_sable_first_mill.py
          result=$?
          echo "--- Create callback diagnostics ---"
          grep 'HEARTHBOUND_PROCESS_' sable-first-mill.log || true
          exit "$result"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sable-first-mill-logs
          path: |
            sable-first-mill.log
            run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
