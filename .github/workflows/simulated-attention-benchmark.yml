name: Simulated selective attention benchmark
on:
  pull_request:
    paths:
      - 'scripts/train_simulated_attention_mlp.py'
      - 'scripts/test_train_simulated_attention_mlp.py'
      - 'scripts/evaluate_simulated_attention_robustness.py'
      - 'scripts/test_evaluate_simulated_attention_robustness.py'
      - 'scripts/evaluate_causal_attention_history.py'
      - 'scripts/test_evaluate_causal_attention_history.py'
      - '.github/workflows/simulated-attention-benchmark.yml'
  workflow_dispatch:
jobs:
  attention:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test observation isolation and reproducibility
        run: python3 scripts/test_train_simulated_attention_mlp.py
      - name: Train and evaluate simulator-only policies
        run: |
          python3 scripts/train_simulated_attention_mlp.py \
            --seed 11 --episodes 500 --heldout 120 \
            --output simulated-attention-benchmark.json
          python3 - <<'PY'
          import json
          result=json.load(open("simulated-attention-benchmark.json"))
          assert result["origin"]=="SIMULATED_ONLY"
          assert result["minecraft_policy_deployed"] is False
          assert result["citizen_actions_authorized"] is False
          assert result["evaluation"]["trained_mlp"]["episodes"]==120
          assert result["evaluation"]["scripted_least_recent"]["episodes"]==120
          print("SIMULATED_ATTENTION_CI_PASS")
          PY
      - name: Verify paired robustness experiment contracts
        run: python3 scripts/test_evaluate_simulated_attention_robustness.py
      - name: Evaluate multiple seeds and distribution shifts
        run: |
          python3 scripts/evaluate_simulated_attention_robustness.py \
            --seeds 11 17 23 --train-episodes 500 --heldout 100 --bootstrap 500 \
            --output simulated-attention-robustness.json
          python3 - <<'PY'
          import json
          result=json.load(open("simulated-attention-robustness.json"))
          assert result["origin"]=="SIMULATED_ONLY"
          assert not result["minecraft_policy_deployed"]
          assert not result["citizen_actions_authorized"]
          assert len(result["results"])==12
          assert len(result["regimes"])==4
          print("PAIRED_ATTENTION_ROBUSTNESS_CI_PASS")
          PY
      - name: Verify no privileged volatility or latent source truth
        run: python3 scripts/test_evaluate_causal_attention_history.py
      - name: Evaluate history-estimated attention on disjoint worlds
        run: |
          python3 scripts/evaluate_causal_attention_history.py \
            --seeds 11 17 23 --train-episodes 500 --heldout 100 --bootstrap 300 \
            --output causal-attention-history.json
          python3 - <<'PY'
          import json
          data=json.load(open("causal-attention-history.json"))
          assert data["origin"]=="SIMULATED_ONLY"
          assert data["privileged_volatility_feature"] is False
          assert data["true_source_availability_visible_to_policy"] is False
          assert data["minecraft_policy_deployed"] is False
          assert data["citizen_actions_authorized"] is False
          assert len(data["results"])==12
          print("CAUSAL_ATTENTION_HISTORY_CI_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: simulated-attention-benchmark
          path: |
            simulated-attention-benchmark.json
            simulated-attention-robustness.json
            causal-attention-history.json
          if-no-files-found: error
