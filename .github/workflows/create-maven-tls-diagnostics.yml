name: Create Maven TLS diagnostics
on:
  pull_request:
    paths:
      - '.github/workflows/create-maven-tls-diagnostics.yml'
      - 'scripts/report_create_maven_tls.py'
      - 'scripts/test_report_create_maven_tls.py'
      - 'build.gradle'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-maven-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check HTTPS trust on four official project dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_report_create_maven_tls.py
          python3 - <<'PY'
          import json
          root="https://maven.createmod.net"
          mirror="https://maven.ithundxr.dev/mirror"
          urls={
            "create_pom":root+"/com/simibubi/create/create-1.20.1/6.0.8-289/create-1.20.1-6.0.8-289.pom",
            "flywheel_pom":root+"/dev/engine-room/flywheel/flywheel-forge-1.20.1/1.0.5/flywheel-forge-1.20.1-1.0.5.pom",
            "ponder_pom":root+"/net/createmod/ponder/Ponder-Forge-1.20.1/1.0.91/Ponder-Forge-1.20.1-1.0.91.pom",
            "registrate_pom":mirror+"/com/tterrag/registrate/Registrate/MC1.20-1.3.3/Registrate-MC1.20-1.3.3.pom",
          }
          json.dump(urls,open("dependency-endpoints.json","w"),indent=2)
          PY
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          urls=json.loads(Path("dependency-endpoints.json").read_text())
          out={}
          for key,url in urls.items():
              command=["curl","--silent","--show-error","--location","--head",
                       "--max-time","18","--output","/dev/null","--write-out","%{http_code}",url]
              result=subprocess.run(command,text=True,capture_output=True,check=False,timeout=24)
              try:code=int(result.stdout.strip()[-3:])
              except ValueError:code=0
              out[key]={"url":url,"curl_exit":result.returncode,"http_code":code,
                        "ca_verified":result.returncode==0}
              print(key,"curl_exit",result.returncode,"HTTP",code,
                    "TLS verification required; no --insecure option used")
              if result.stderr:
                  print("transport_error:",result.stderr[:500])
          Path("dependency-tls-raw.json").write_text(json.dumps(out,indent=2))
          PY
          python3 scripts/report_create_maven_tls.py dependency-tls-raw.json --output create-maven-diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: create-maven-tls-diagnostic
          path: |
            dependency-endpoints.json
            dependency-tls-raw.json
            create-maven-diagnostic.json
          if-no-files-found: warn
