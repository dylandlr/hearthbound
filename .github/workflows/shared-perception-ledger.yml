name: Shared colony perception ledger contracts
on:
  pull_request:
    paths:
      - 'src/main/java/dev/hearthbound/perception/**'
      - 'src/test/java/dev/hearthbound/perception/**'
      - '.github/workflows/shared-perception-ledger.yml'
  workflow_dispatch:
jobs:
  independent-java-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile independent event ledger and assertion harness
        run: |
          mkdir -p /tmp/hearthbound-perception
          javac --release 17 -d /tmp/hearthbound-perception \
            src/main/java/dev/hearthbound/perception/SharedPerceptionLedger.java \
            src/test/java/dev/hearthbound/perception/SharedPerceptionLedgerTest.java
      - name: Test scope isolation, provenance, expiry, backpressure and loss
        run: |
          java -cp /tmp/hearthbound-perception \
            dev.hearthbound.perception.SharedPerceptionLedgerTest
