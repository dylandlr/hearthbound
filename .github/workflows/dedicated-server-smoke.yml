name: Minecraft dedicated server smoke
on:
  push:
    branches:
      - test/dedicated-server-smoke
      - feat/haul-restart-quarantine-v2-3
  pull_request:
jobs:
  boot-server:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        policy: [SCRIPTED, TRAINED_MLP]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Validate evidence parser and RCON framing
        run: |
          python3 scripts/test_report_observation_v2.py
          python3 scripts/test_report_source_plans.py
          python3 scripts/test_report_source_observations.py
          python3 scripts/test_report_policy_rejection.py
          python3 scripts/test_build_minecraft_experience.py
          python3 scripts/test_compare_real_policy_trials.py
          python3 scripts/test_report_policy_trial.py
          python3 scripts/test_report_live_shadow.py
          python3 scripts/test_rcon_frames.py
      - name: Resolve and compile Forge dependencies before startup clock
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "FORGE_PREFLIGHT attempt=$attempt"
            if gradle --no-daemon classes > forge-preflight.log 2>&1; then
              echo "FORGE_PREFLIGHT_SUCCESS"
              break
            fi
            echo "FORGE_PREFLIGHT_ATTEMPT_FAILED attempt=$attempt"
            tail -n 65 forge-preflight.log
            # A Java compilation error is deterministic: retries cannot
            # repair source. Only retry intermittent dependency/network issues.
            if grep -Eq '(^|[[:space:]])[[:alnum:]_./-]+\\.java:[0-9]+: error:|Compilation failed; see the compiler error output' forge-preflight.log; then
              echo "FORGE_SOURCE_COMPILATION_FAILURE"
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "FORGE_DEPENDENCY_OR_COMPILATION_FAILURE"
              exit 1
            fi
            sleep 25
          done
      - name: Start a disposable Forge dedicated server
        shell: bash
        env:
          HEARTHBOUND_RCON_PASSWORD: ci-local-disposable-password
          HEARTHBOUND_TRIAL_MODE: ${{ matrix.policy }}
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nlevel-name=smoke-world\nlevel-seed=hearthbound-policy-v0-8-10\nmax-players=2\nenable-rcon=true\nrcon.port=25575\nrcon.password=%s\n' "$HEARTHBOUND_RCON_PASSWORD" > run/server.properties
          gradle --no-daemon runServer > server-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 360); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' server-smoke.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Minecraft server process exited before readiness"
              tail -n 120 server-smoke.log
              exit 1
            fi
            if [ $((i % 30)) -eq 0 ]; then
              echo "Cold Forge startup pending after $((i * 2)) seconds"
              tail -n 8 server-smoke.log || true
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Minecraft server did not reach ready state within 12 minutes"
            tail -n 120 server-smoke.log
            exit 1
          fi
          echo "Minecraft dedicated server reached ready state"
          if ! grep -Fq 'Hearthbound bootstrap loaded.' server-smoke.log; then
            echo "Minecraft started but Hearthbound initialization was not confirmed"
            tail -n 120 server-smoke.log
            exit 1
          fi
          echo "Hearthbound mod initialization confirmed"
          python3 scripts/rcon_smoke.py | tee smoke-rcon.log
          python3 scripts/report_live_shadow.py smoke-rcon.log --output live-shadow-report.json
          python3 scripts/report_policy_trial.py smoke-rcon.log --expected-mode "$HEARTHBOUND_TRIAL_MODE" --output policy-trial-result.json
          python3 scripts/report_policy_rejection.py smoke-rcon.log --expected-mode "$HEARTHBOUND_TRIAL_MODE" --output policy-rejection.json
          python3 scripts/report_source_observations.py smoke-rcon.log --output source-observations.json
          python3 scripts/report_source_plans.py smoke-rcon.log --output source-plans.json
          python3 scripts/report_observation_v2.py smoke-rcon.log --output observation-v2.json
          echo "Verifying citizen NBT survives save and dedicated-server restart"
          python3 scripts/rcon_verify_sable_restart.py checkpoint
          for i in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "First server failed to stop after save-all"
            exit 1
          fi
          wait "$pid" || true
          mv server-smoke.log server-before-restart.log
          gradle --no-daemon runServer > server-after-restart.log 2>&1 &
          pid=$!
          restarted=0
          for i in $(seq 1 360); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' server-after-restart.log; then
              restarted=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Server exited during restart"
              tail -n 120 server-after-restart.log
              exit 1
            fi
            sleep 2
          done
          if [ "$restarted" -ne 1 ]; then
            echo "Server failed to restart"
            tail -n 120 server-after-restart.log
            exit 1
          fi
          python3 scripts/rcon_verify_sable_restart.py verify | tee verified-restart.log
          python3 scripts/build_minecraft_experience.py \
            policy-trial-result.json live-shadow-report.json \
            --restart-log verified-restart.log --output minecraft-experience.json
          grep -E 'Hearthbound bootstrap loaded|Done \(' server-smoke.log || true
      - name: Upload startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-policy-trial-${{ matrix.policy }}
          path: |
            server-smoke.log
            forge-preflight.log
            server-before-restart.log
            server-after-restart.log
            run/logs/latest.log
            smoke-rcon.log
            live-shadow-report.json
            policy-trial-result.json
            policy-rejection.json
            source-observations.json
            source-plans.json
            observation-v2.json
            verified-restart.log
            minecraft-experience.json
          if-no-files-found: warn
          retention-days: 14

  compare-policy-arms:
    needs: boot-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: minecraft-policy-trial-*
          path: policy-trials
          merge-multiple: false
      - name: Verify both live Minecraft trial records before comparison
        run: |
          python3 scripts/test_compare_real_policy_trials.py
          python3 scripts/compare_real_policy_trials.py \
            policy-trials/minecraft-policy-trial-SCRIPTED/policy-trial-result.json \
            policy-trials/minecraft-policy-trial-TRAINED_MLP/policy-trial-result.json \
            --output policy-comparison.json
          python3 scripts/aggregate_minecraft_experience.py \
            policy-trials/minecraft-policy-trial-SCRIPTED/minecraft-experience.json \
            policy-trials/minecraft-policy-trial-TRAINED_MLP/minecraft-experience.json \
            --output minecraft-experience-dataset.json
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-policy-comparison
          path: |
            policy-comparison.json
            minecraft-experience-dataset.json
          if-no-files-found: error
