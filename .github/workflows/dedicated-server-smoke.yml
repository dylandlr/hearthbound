name: Minecraft dedicated server smoke
on:
  push:
    branches:
      - test/dedicated-server-smoke
  pull_request:
jobs:
  boot-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Start a disposable Forge dedicated server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nlevel-name=smoke-world\nmax-players=2\n' > run/server.properties
          gradle --no-daemon runServer > server-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 240); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' server-smoke.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Minecraft server process exited before readiness"
              tail -n 120 server-smoke.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Minecraft server did not reach ready state within 8 minutes"
            tail -n 120 server-smoke.log
            exit 1
          fi
          echo "Minecraft dedicated server reached ready state"
          grep -E 'Hearthbound bootstrap loaded|Done \(' server-smoke.log || true
      - name: Upload startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-dedicated-server-smoke-logs
          path: |
            server-smoke.log
            run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
