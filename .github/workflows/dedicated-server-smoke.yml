name: Minecraft dedicated server smoke
on:
  push:
    branches:
      - test/dedicated-server-smoke
      - feat/haul-restart-quarantine-v2-3
  pull_request:
jobs:
  boot-server:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        policy: [SCRIPTED, TRAINED_MLP]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Validate evidence parser and RCON framing
        run: |
          python3 scripts/test_report_observation_v2.py
          python3 scripts/test_report_source_plans.py
          python3 scripts/test_report_source_observations.py
          python3 scripts/test_report_policy_rejection.py
          python3 scripts/test_build_minecraft_experience.py
          python3 scripts/test_compare_real_policy_trials.py
          python3 scripts/test_report_policy_trial.py
          python3 scripts/test_report_live_shadow.py
          python3 scripts/test_rcon_frames.py
          python3 scripts/test_validate_live_perception_receipts.py
          python3 scripts/test_replay_real_forge_chronology.py
          python3 scripts/test_validate_forge_attention_opportunity.py
          python3 scripts/test_validate_forge_attention_pair.py
          python3 scripts/test_validate_forge_attention_journal.py
          python3 scripts/test_validate_forge_attention_manifest.py
          python3 scripts/test_export_verified_citizen_experience.py
          python3 scripts/test_evaluate_real_attention_shadow.py
      - name: Resolve and compile Forge dependencies before startup clock
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "FORGE_PREFLIGHT attempt=$attempt"
            if gradle --no-daemon classes > forge-preflight.log 2>&1; then
              echo "FORGE_PREFLIGHT_SUCCESS"
              break
            fi
            echo "FORGE_PREFLIGHT_ATTEMPT_FAILED attempt=$attempt"
            tail -n 65 forge-preflight.log
            # A Java compilation error is deterministic: retries cannot
            # repair source. Only retry intermittent dependency/network issues.
            if grep -Eq '(^|[[:space:]])[[:alnum:]_./-]+\\.java:[0-9]+: error:|Compilation failed; see the compiler error output' forge-preflight.log; then
              echo "FORGE_SOURCE_COMPILATION_FAILURE"
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "FORGE_DEPENDENCY_OR_COMPILATION_FAILURE"
              exit 1
            fi
            sleep 25
          done
      - name: Start a disposable Forge dedicated server
        shell: bash
        env:
          HEARTHBOUND_RCON_PASSWORD: ci-local-disposable-password
          HEARTHBOUND_TRIAL_MODE: ${{ matrix.policy }}
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nlevel-name=smoke-world\nlevel-seed=hearthbound-policy-v0-8-10\nmax-players=2\nenable-rcon=true\nrcon.port=25575\nrcon.password=%s\n' "$HEARTHBOUND_RCON_PASSWORD" > run/server.properties
          gradle --no-daemon runServer > server-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 360); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' server-smoke.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Minecraft server process exited before readiness"
              tail -n 120 server-smoke.log
              exit 1
            fi
            if [ $((i % 30)) -eq 0 ]; then
              echo "Cold Forge startup pending after $((i * 2)) seconds"
              tail -n 8 server-smoke.log || true
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Minecraft server did not reach ready state within 12 minutes"
            tail -n 120 server-smoke.log
            exit 1
          fi
          echo "Minecraft dedicated server reached ready state"
          if ! grep -Fq 'Hearthbound bootstrap loaded.' server-smoke.log; then
            echo "Minecraft started but Hearthbound initialization was not confirmed"
            tail -n 120 server-smoke.log
            exit 1
          fi
          echo "Hearthbound mod initialization confirmed"
          python3 scripts/rcon_smoke.py | tee smoke-rcon.log
          python3 scripts/report_live_shadow.py smoke-rcon.log --output live-shadow-report.json
          python3 scripts/report_policy_trial.py smoke-rcon.log --expected-mode "$HEARTHBOUND_TRIAL_MODE" --output policy-trial-result.json
          python3 scripts/report_policy_rejection.py smoke-rcon.log --expected-mode "$HEARTHBOUND_TRIAL_MODE" --output policy-rejection.json
          python3 scripts/report_source_observations.py smoke-rcon.log --output source-observations.json
          python3 scripts/report_source_plans.py smoke-rcon.log --output source-plans.json
          python3 scripts/report_observation_v2.py smoke-rcon.log --output observation-v2.json
          echo "Verifying actual read-only Forge source receipt transitions by RCON"
          python3 scripts/rcon_perception_acceptance.py | tee real-perception-rcon.log
          python3 scripts/validate_live_perception_receipts.py             real-perception-receipts.txt --output real-perception-validated.json
          echo "Verifying chronology-safe offline replay of actual Forge evidence"
          python3 scripts/replay_real_forge_chronology.py \
            real-perception-validated.json --output real-forge-shadow-timeline.json
          python3 - <<'PY'
          import json
          a=json.load(open("real-perception-acceptance.json"))
          b=json.load(open("real-perception-validated.json"))
          assert a["origin"]=="REAL_FORGE_RCON"
          assert a["verified_events"]==b["receipts"]==3
          assert [e["state"] for e in a["states"]]==["EMPTY","AVAILABLE","EMPTY"]
          assert a["camera_frames_captured"]==0 and a["neural_learning_performed"] is False
          assert b["task_execution_authorized"] is False
          print("VERIFIED_REAL_PERCEPTION_ACCEPTANCE read_only=true transitions=3")
          PY
          echo "Verifying real Forge citizen-to-citizen reported knowledge"
          python3 scripts/rcon_social_reports_acceptance.py | tee real-social-reports-rcon.log
          python3 scripts/validate_forge_attention_opportunity.py \
            real-attention-opportunity.txt --output real-attention-opportunity.json
          python3 scripts/validate_forge_attention_pair.py \
            real-attention-opportunity.txt real-attention-outcome.txt \
            --output real-attention-paired-evidence.json
          echo "Verifying persisted session-scoped Forge attention hash chain"
          journal_files=()
          while IFS= read -r path; do journal_files+=("$path"); done < <(find run -type f -path '*/hearthbound-attention/attention-*.jsonl')
          if [ "${#journal_files[@]}" -ne 1 ]; then
            echo "Expected exactly one durable Forge attention log, found ${#journal_files[@]}"
            exit 1
          fi
          python3 scripts/validate_forge_attention_journal.py "${journal_files[0]}" \
            --min-records 2 --output verified-attention-journal.json
          python3 -c 'import json; x=json.load(open("verified-attention-journal.json")); assert x["distinct_observer_sources_selected"]>=2 and x["hash_chain_valid"]'
          sealed_manifest="${journal_files[0]%.jsonl}.manifest.json"
          python3 scripts/validate_forge_attention_manifest.py "${journal_files[0]}" "$sealed_manifest" \
            --min-records 2 --output verified-attention-run-before-restart.json
          python3 scripts/export_verified_citizen_experience.py "${journal_files[0]}" "$sealed_manifest" \
            --min-records 2 --output citizen-experience-before-restart.json
          python3 scripts/evaluate_real_attention_shadow.py citizen-experience-before-restart.json \
            --output real-attention-shadow-before-restart.json
          echo "Verifying citizen NBT survives save and dedicated-server restart"
          python3 scripts/rcon_verify_sable_restart.py checkpoint
          for i in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "First server failed to stop after save-all"
            exit 1
          fi
          wait "$pid" || true
          mv server-smoke.log server-before-restart.log
          gradle --no-daemon runServer > server-after-restart.log 2>&1 &
          pid=$!
          restarted=0
          for i in $(seq 1 360); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' server-after-restart.log; then
              restarted=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Server exited during restart"
              tail -n 120 server-after-restart.log
              exit 1
            fi
            sleep 2
          done
          if [ "$restarted" -ne 1 ]; then
            echo "Server failed to restart"
            tail -n 120 server-after-restart.log
            exit 1
          fi
          python3 scripts/rcon_verify_sable_restart.py verify | tee verified-restart.log
          python3 scripts/validate_forge_attention_manifest.py "${journal_files[0]}" "$sealed_manifest" \
            --min-records 2 --output verified-attention-run-after-restart.json
          python3 scripts/export_verified_citizen_experience.py "${journal_files[0]}" "$sealed_manifest" \
            --min-records 2 --output citizen-experience-after-restart.json
          python3 scripts/evaluate_real_attention_shadow.py citizen-experience-after-restart.json \
            --output real-attention-shadow-after-restart.json
          cmp real-attention-shadow-before-restart.json real-attention-shadow-after-restart.json
          cmp citizen-experience-before-restart.json citizen-experience-after-restart.json
          cmp verified-attention-run-before-restart.json verified-attention-run-after-restart.json
          python3 scripts/build_minecraft_experience.py \
            policy-trial-result.json live-shadow-report.json \
            --restart-log verified-restart.log --output minecraft-experience.json
          grep -E 'Hearthbound bootstrap loaded|Done \(' server-smoke.log || true
      - name: Upload startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-policy-trial-${{ matrix.policy }}
          path: |
            server-smoke.log
            forge-preflight.log
            server-before-restart.log
            server-after-restart.log
            run/logs/latest.log
            smoke-rcon.log
            real-perception-rcon.log
            real-perception-receipts.txt
            real-perception-acceptance.json
            real-perception-validated.json
            real-forge-shadow-timeline.json
            real-social-reports-rcon.log
            real-attention-opportunity.txt
            real-attention-opportunity.json
            real-attention-outcome.txt
            real-attention-paired-evidence.json
            verified-attention-journal.json
            verified-attention-run-before-restart.json
            verified-attention-run-after-restart.json
            citizen-experience-before-restart.json
            citizen-experience-after-restart.json
            real-attention-shadow-before-restart.json
            real-attention-shadow-after-restart.json
            run/**/hearthbound-attention/*.manifest.json
            run/**/hearthbound-attention/*.jsonl
            live-shadow-report.json
            policy-trial-result.json
            policy-rejection.json
            source-observations.json
            source-plans.json
            observation-v2.json
            verified-restart.log
            minecraft-experience.json
          if-no-files-found: warn
          retention-days: 14

  compare-policy-arms:
    needs: boot-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: minecraft-policy-trial-*
          path: policy-trials
          merge-multiple: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify both live Minecraft trial records before comparison
        run: |
          python3 scripts/test_compare_real_policy_trials.py
          python3 scripts/compare_real_policy_trials.py \
            policy-trials/minecraft-policy-trial-SCRIPTED/policy-trial-result.json \
            policy-trials/minecraft-policy-trial-TRAINED_MLP/policy-trial-result.json \
            --output policy-comparison.json
          python3 scripts/aggregate_minecraft_experience.py \
            policy-trials/minecraft-policy-trial-SCRIPTED/minecraft-experience.json \
            policy-trials/minecraft-policy-trial-TRAINED_MLP/minecraft-experience.json \
            --output minecraft-experience-dataset.json
      - name: Run frozen simulator-trained neural Q against archived real Minecraft states (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_report_mill_context_coverage.py
          python3 scripts/test_report_real_neural_q_shadow.py
          python3 scripts/train_simulated_mill_neural_q.py \
            --seed 11 --episodes 300 --heldout 80 \
            --output simulated-shadow-training.json \
            --checkpoint simulated-shadow-checkpoint.json
          python3 scripts/export_neural_q_java_parity.py \
            simulated-shadow-checkpoint.json \
            --weights simulated-shadow-java-weights.txt \
            --fixtures simulated-shadow-python-fixtures.txt
          mkdir -p /tmp/hb-neural-q
          javac --release 17 -d /tmp/hb-neural-q \
            src/test/java/dev/hearthbound/evidence/SimulatedNeuralQParity.java \
            src/test/java/dev/hearthbound/evidence/RealMinecraftNeuralQShadow.java \
            src/main/java/dev/hearthbound/evidence/NeuralQContextGate.java \
            src/test/java/dev/hearthbound/evidence/RealMinecraftNeuralQContextReplay.java \
            src/test/java/dev/hearthbound/evidence/NeuralQContextGateTest.java
          java -cp /tmp/hb-neural-q dev.hearthbound.evidence.SimulatedNeuralQParity \
            simulated-shadow-java-weights.txt simulated-shadow-python-fixtures.txt
          java -cp /tmp/hb-neural-q dev.hearthbound.evidence.RealMinecraftNeuralQShadow \
            simulated-shadow-java-weights.txt \
            policy-trials/minecraft-policy-trial-SCRIPTED/smoke-rcon.log SCRIPTED | tee neural-shadow-scripted.log
          java -cp /tmp/hb-neural-q dev.hearthbound.evidence.RealMinecraftNeuralQShadow \
            simulated-shadow-java-weights.txt \
            policy-trials/minecraft-policy-trial-TRAINED_MLP/smoke-rcon.log TRAINED_MLP | tee neural-shadow-trained.log
          python3 scripts/report_real_neural_q_shadow.py \
            neural-shadow-scripted.log neural-shadow-trained.log \
            --output real-neural-q-shadow.json
          java -cp /tmp/hb-neural-q dev.hearthbound.evidence.NeuralQContextGateTest
          java -cp /tmp/hb-neural-q dev.hearthbound.evidence.RealMinecraftNeuralQContextReplay \
            simulated-shadow-java-weights.txt \
            policy-trials/minecraft-policy-trial-SCRIPTED/smoke-rcon.log SCRIPTED | tee mill-context-scripted.log
          java -cp /tmp/hb-neural-q dev.hearthbound.evidence.RealMinecraftNeuralQContextReplay \
            simulated-shadow-java-weights.txt \
            policy-trials/minecraft-policy-trial-TRAINED_MLP/smoke-rcon.log TRAINED_MLP | tee mill-context-trained.log
          python3 scripts/report_mill_context_coverage.py \
            mill-context-scripted.log mill-context-trained.log \
            --output real-mill-context-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-policy-comparison
          path: |
            policy-comparison.json
            minecraft-experience-dataset.json
            real-neural-q-shadow.json
            real-mill-context-coverage.json
            simulated-shadow-checkpoint.json
          if-no-files-found: error
