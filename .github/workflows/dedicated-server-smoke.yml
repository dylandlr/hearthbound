name: Hearthbound dedicated server smoke test
on:
  workflow_dispatch:
    inputs:
      accept_minecraft_eula:
        description: 'I have reviewed and accept the Minecraft EULA for this ephemeral test server'
        required: true
        type: boolean
        default: false

jobs:
  server-smoke:
    if: ${{ inputs.accept_minecraft_eula == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Configure ephemeral local test server
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'EOF'
          online-mode=false
          server-port=25565
          max-players=1
          enable-command-block=true
          spawn-protection=0
          motd=Hearthbound CI smoke test
          EOF
      - name: Boot Forge development server
        shell: bash
        run: |
          set +e
          timeout --signal=INT --kill-after=20s 300s gradle --no-daemon runServer > server-smoke.log 2>&1
          exit_code=$?
          set -e
          tail -n 120 server-smoke.log
          # A timeout is expected for a healthy long-running server.
          if ! grep -Eq 'Done \([0-9.]+s\)!|Done \(' server-smoke.log; then
            echo 'No successful Minecraft server-ready message; inspect logs' >&2
            exit 1
          fi
          if ! grep -Fq 'Hearthbound bootstrap loaded.' server-smoke.log; then
            echo 'Hearthbound bootstrap marker absent; server readiness alone is not sufficient' >&2
            exit 1
          fi
          if grep -Eiq 'Exception in server tick loop|Failed to start the minecraft server|Mod loading has failed' server-smoke.log; then
            echo 'Server reported a startup/runtime failure' >&2
            exit 1
          fi
          if [[ "$exit_code" != "124" && "$exit_code" != "0" ]]; then
            echo "Unexpected server exit code: $exit_code" >&2
            exit 1
          fi
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hearthbound-server-smoke-logs
          path: |
            server-smoke.log
            run/logs/*.log
          if-no-files-found: warn
          retention-days: 7
