name: Create First Mill integration
on:
  push:
    branches:
      - feat/first-mill-create-v3-2
  workflow_dispatch:
jobs:
  create-forge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile Hearthbound against real Create API
        run: gradle --no-daemon compileJava
      - name: Start Forge with Create loaded and inspect millstone
        shell: bash
        env:
          HEARTHBOUND_RCON_PASSWORD: ci-local-disposable-password
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nlevel-name=create-world\nmax-players=2\nenable-rcon=true\nrcon.port=25575\nrcon.password=%s\n' "$HEARTHBOUND_RCON_PASSWORD" > run/server.properties
          gradle --no-daemon runServer > create-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 360); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' create-server.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              tail -n 120 create-server.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 120 create-server.log
            exit 1
          fi
          python3 scripts/rcon_create_mill_smoke.py
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-first-mill-server-logs
          path: |
            create-server.log
            run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
