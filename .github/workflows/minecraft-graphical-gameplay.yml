name: Minecraft graphical gameplay capture
on:
  workflow_dispatch:
  push:
    branches:
      - feat/ci-gameplay-capture-v2-6
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HEARTHBOUND_RCON_PASSWORD: ci-local-disposable-password
      DISPLAY: ':99'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Install video and virtual display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb ffmpeg libgl1-mesa-dri libgl1 libxrandr2 libxi6 libxcursor1 libxinerama1 libasound2t64 || sudo apt-get install -y xvfb ffmpeg libgl1-mesa-dri libgl1 libxrandr2 libxi6 libxcursor1 libxinerama1
      - name: Verify scenario syntax
        run: python3 -m py_compile scripts/rcon_autonomous_scientist.py
      - name: Start Forge server and rendered Minecraft client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run gameplay-capture
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nlevel-name=gameplay-capture-world\nmax-players=3\nserver-port=25565\nenable-rcon=true\nrcon.port=25575\nrcon.password=%s\n' "$HEARTHBOUND_RCON_PASSWORD" > run/server.properties
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > gameplay-capture/xvfb.log 2>&1 &
          xvfb_pid=$!
          gradle --no-daemon runServer > gameplay-capture/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" "$xvfb_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 360); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' gameplay-capture/server.log; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then echo "Forge server did not start"; tail -n 100 gameplay-capture/server.log; exit 1; fi
          # ForgeGradle supplies Minecraft's native libraries and the mod classpath.
          # --server and --port request a direct multiplayer connection at launch.
          gradle --no-daemon runClient --args='--username HearthboundCamera --server 127.0.0.1 --port 25565' > gameplay-capture/client.log 2>&1 &
          client_pid=$!
          trap 'kill "$client_pid" "$server_pid" "$xvfb_pid" 2>/dev/null || true' EXIT
          # Do not claim gameplay footage if the graphical client never connects.
          connected=0
          for i in $(seq 1 150); do
            if grep -Eq 'HearthboundCamera.*(joined the game|logged in)' gameplay-capture/server.log; then connected=1; break; fi
            if ! kill -0 "$client_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$connected" -ne 1 ]; then
            echo "Client did not join; refusing to label virtual-display capture gameplay"
            tail -n 100 gameplay-capture/client.log || true
            exit 1
          fi
          ffmpeg -hide_banner -loglevel warning -y -f x11grab -framerate 15 -video_size 1280x720 -i :99.0 -c:v libx264 -preset ultrafast -crf 28 -pix_fmt yuv420p gameplay-capture/minecraft-gameplay.mp4 > gameplay-capture/ffmpeg.log 2>&1 &
          ffmpeg_pid=$!
          set +e
          python3 scripts/rcon_autonomous_scientist.py > gameplay-capture/scenario.log 2>&1
          scenario_rc=$?
          set -e
          kill -INT "$ffmpeg_pid" 2>/dev/null || true
          wait "$ffmpeg_pid" || true
          cat gameplay-capture/scenario.log
          test "$scenario_rc" -eq 0
          test -s gameplay-capture/minecraft-gameplay.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 gameplay-capture/minecraft-gameplay.mp4
      - name: Upload genuine client footage and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-graphical-gameplay-capture
          path: |
            gameplay-capture/
            run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
