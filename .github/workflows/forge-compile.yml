name: Forge compilation
on:
  push:
    branches:
      - 'fix/haul-preflight-safety'
      - 'feat/sable-hauling-job'
      - 'feat/sable-villager-slice'
      - 'feat/haul-restart-quarantine-v2-3'
  pull_request:
jobs:
  compile-forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile actual Forge Minecraft sources
        run: gradle --no-daemon compileJava
