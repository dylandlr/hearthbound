name: Minecraft multi-seed benchmark
on:
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        options:
          - autonomous-scientist
          - basic-smoke
        default: autonomous-scientist
      seeds:
        description: "Preset seed set"
        type: choice
        options:
          - small
          - medium
        default: small
  push:
    branches:
      - feat/minecraft-multiseed-benchmarks-v2-0
jobs:
  trial:
    strategy:
      fail-fast: false
      matrix:
        seed: [11, 42, 73]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HEARTHBOUND_RCON_PASSWORD: ci-local-disposable-password
      SCENARIO: ${{ inputs.scenario || 'autonomous-scientist' }}
      SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Simulate actual Minecraft server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run simulation-results
          python3 -m py_compile scripts/rcon_autonomous_scientist.py scripts/rcon_smoke.py scripts/summarize_minecraft_simulation.py
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nlevel-name=ci-multiseed\nlevel-seed=%s\nmax-players=2\nenable-rcon=true\nrcon.port=25575\nrcon.password=%s\n' "$SEED" "$HEARTHBOUND_RCON_PASSWORD" > run/server.properties
          gradle --no-daemon runServer > simulation-results/server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 360); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' simulation-results/server.log; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          rc=1
          if [ "$ready" -eq 1 ]; then
            set +e
            if [ "$SCENARIO" = "basic-smoke" ]; then
              python3 scripts/rcon_smoke.py > simulation-results/scenario.log 2>&1
            else
              python3 scripts/rcon_autonomous_scientist.py > simulation-results/scenario.log 2>&1
            fi
            rc=$?
            set -e
          else
            echo "Server startup failed" > simulation-results/scenario.log
          fi
          python3 scripts/summarize_minecraft_simulation.py --log simulation-results/server.log --scenario "$SCENARIO" --seed "$SEED" --exit-code "$rc" --output simulation-results/summary.json
          exit "$rc"
      - name: Upload individual run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-seed-${{ matrix.seed }}
          path: simulation-results/
          retention-days: 14
  aggregate:
    needs: [trial]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: minecraft-seed-*
          path: collected
      - name: Summarize multi-seed results
        run: |
          python3 scripts/aggregate_minecraft_simulations.py collected --output benchmark/aggregate.json
          cat benchmark/aggregate.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minecraft-benchmark-aggregate
          path: benchmark/
