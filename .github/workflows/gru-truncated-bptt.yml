name: GRU truncated BPTT frozen-world research
on:
  pull_request:
    paths:
      - 'scripts/benchmark_gru_truncated_bptt.py'
      - 'scripts/test_benchmark_gru_truncated_bptt.py'
      - 'scripts/benchmark_recurrent_causal_attention.py'
      - '.github/workflows/gru-truncated-bptt.yml'
  workflow_dispatch:
jobs:
  evaluate-bptt:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric dependency
        run: python3 -m pip install 'numpy>=1.26,<3'
      - name: Validate temporal gradient and selected-outcome privacy
        run: |
          set -euo pipefail
          python3 scripts/test_benchmark_gru_truncated_bptt.py
      - name: Evaluate three-seed GRU training comparison
        run: |
          set -euo pipefail
          python3 scripts/benchmark_gru_truncated_bptt.py \
            --seeds 11 17 23 --episodes 180 --heldout 30 \
            --output gru-bptt-attention.json
          python3 -c 'import json; r=json.load(open("gru-bptt-attention.json")); assert r["origin"]=="SIMULATED_ONLY" and r["bptt_window"]==8 and r["fixed_trajectory_controls"] is True and r["minecraft_model_promotion_authorized"] is False and len(r["cases"])==36'
      - uses: actions/upload-artifact@v4
        with:
          name: gru-truncated-bptt-three-seed-comparison
          path: gru-bptt-attention.json
          if-no-files-found: error
